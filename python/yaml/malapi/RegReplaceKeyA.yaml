name: RegReplaceKeyA
dll: Advapi32.dll
description: RegReplaceKeyA is used to replace the file backing a registry key and
  all its subkeys with another file, so that when the system is next started, the
  key and subkeys will have the values stored in the new file.
attacks:
- Helper
source: malapi/malapi.io/winapi/RegReplaceKeyA.html
