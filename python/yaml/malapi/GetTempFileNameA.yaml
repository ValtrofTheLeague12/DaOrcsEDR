name: GetTempFileNameA
dll: Kernel32.dll
description: GetTempFileNameA is used to create a name for a temporary file. If a
  unique file name is generated, an empty file is created and the handle to it is
  released; otherwise, only a file name is generated.
attacks:
- Helper
