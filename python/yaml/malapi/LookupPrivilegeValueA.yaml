name: LookupPrivilegeValueA
dll: Advapi32.dll
description: LookupPrivilegeValueA is used to retrieve the locally unique identifier
  (LUID) used on a specified system to locally represent the specified privilege name.
  This function is commonly used by malware in process injection or token stealing.
attacks:
- Enumeration
