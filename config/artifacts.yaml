# Optional evidence bundle automation for static_analyzer.
# Standard JSON reports under exports/<sample>_analysis/ are unaffected.
#
# THE TRANSFER SETTINGS LIVE IN config/analysis.yaml NOW. Their artifact keys
# have been deleted from this file rather than left to quietly disagree with
# the winners:
#     upload_artifacts, remote_root, timeout_seconds
# are owned by the MEGA_* analysis settings (edited on the console's Analysis
# Configuration page), which the analyzer applies at startup; this file is no
# longer consulted for them at all. Adding one back here would have no effect
# while the matching analysis.yaml key exists.
# The two lines below remain file-owned FALLBACKS that still decide while
# their MEGA_* twins are absent:
#     encrypt_artifacts
# Once the same setting lives in analysis.yaml, delete its line here too.
# store_artifact stays file-only: building the local bundle is not something
# a per-run analysis setting asks about.
#
# The PROTECTION is a password-protected zip now (mega/protect.py, WinZip
# AES-256). The password is NOT a config value anywhere - it lives in the
# operator password file outside the repo
#     %APPDATA%\IAProject\bundle-keys\upload.password
# (overridable with IA_BUNDLE_PASSWORD_FILE), managed from the console's
# Analysis Configuration page. A password in a repo-read YAML would put it one
# `cat` away from anything that can read the checkout, and setting it here
# would be refused with an error rather than silently honoured.

# Build exports/<sample>_artifact/ with a deterministic tar.gz, SHA-256,
# manifest, and README. This is opt-in; false leaves report exports unchanged.
store_artifact: true

# Wrap the bundle's archive in a password-protected zip before it is uploaded.
#
# Off by default. With this on, the plaintext archive stays on local disk and
# only the protected zip goes to MEGA - and if protection fails (no password
# file, pyzipper missing) the upload is ABORTED rather than falling back to
# plaintext, so a missing password can never quietly downgrade the bundle.
#
# Algorithm: WinZip AES-256 (WZ_AES) through the Python 'pyzipper' library,
# entirely in-process. No gpg, no openssl, no shell. To open a protected zip:
#     python mega/protect.py unzip <bundle>.zip --out-dir .
encrypt_artifacts: false
