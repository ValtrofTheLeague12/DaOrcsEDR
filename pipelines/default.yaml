# Complete static analysis - identical phase order to running with no
# --pipeline flag (keep in sync with planner::parse_default()).
name: default
description: Complete static analysis (classic 27-phase order)

# The old environment block (CTI_SKIP/ML_SKIP) is not here any more.
# config/analysis.yaml owns those switches now and is exported AFTER this
# block, so any line pinned here was only ever outvoted - keeping it meant
# two answers to one question, and agreeing was luck. Set these switches on
# Analysis Configuration; per-pipeline keys stay for the run-wide options.

stages:
  - name: preparation
    phases: [compression, sections, generic_sections]

  - name: features
    phases: [strings, iat, got, histogram, packer, die, opcodes, debug, signature]

  - name: deep-analysis
    phases: [capa, radare2, graphs, xref, guards, extraction, hexdump, cminer, recovery]

  - name: threat-intel
    phases: [cti]

  - name: scoring
    phases: [model]

  - name: reporting
    phases: [export, dashboard, sanity, summary]
